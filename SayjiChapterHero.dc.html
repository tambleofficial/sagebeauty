<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes sjchUp{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes sjchFade{from{opacity:0}to{opacity:1}}
@keyframes sjchDraw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sjchDrift{0%{transform:translateX(-6%) scaleY(1)}50%{transform:translateX(4%) scaleY(1.15)}100%{transform:translateX(-6%) scaleY(1)}}
</style>
</helmet>
<section style="position:relative;height:clamp(480px,66svh,720px);background:#FFFFFF;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end">
  <div style="position:absolute;left:0;right:0;bottom:0;height:0;animation:sjchFade 1.6s ease .2s both;pointer-events:none">
    <div style="position:absolute;left:-15%;right:-15%;top:-120px;height:240px;background:radial-gradient(50% 50% at 50% 50%,rgba(243,167,185,.4) 0%,rgba(251,233,238,.5) 40%,rgba(255,255,255,0) 72%);animation:sjchDrift 18s ease-in-out infinite"></div>
    <div style="position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,rgba(243,167,185,0),#F3A7B9 25%,#EC7693 50%,#F3A7B9 75%,rgba(243,167,185,0));transform-origin:left center;animation:sjchDraw 1.3s cubic-bezier(.7,0,.2,1) .35s both"></div>
  </div>
  <div style="position:relative;max-width:1200px;width:100%;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(56px,7vw,96px);box-sizing:border-box;display:flex;flex-direction:column;gap:clamp(20px,2.4vw,32px)">
    <span style="display:flex;gap:12px;font-family:Inter,sans-serif;font-size:12px;font-weight:500;letter-spacing:.2em;color:#121212;animation:sjchFade .8s ease .1s both"><span style="color:#EC7693">{{ no }}</span><span style="color:#646164">/ 05</span></span>
    <h1 style="margin:0;overflow:hidden;font-family:Inter,sans-serif;font-size:clamp(52px,8vw,112px);font-weight:300;letter-spacing:-.05em;line-height:1;color:#121212"><span style="display:block;animation:sjchUp 1.1s cubic-bezier(.2,.75,.1,1) .25s both">{{ title }}</span></h1>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:560px;animation:sjchFade .9s ease .7s both">
      <span style="font-size:20px;font-weight:600;color:#121212">{{ kr }}</span>
      <p style="margin:0;font-size:17px;line-height:1.8;color:#121212">{{ desc }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720},&quot;no&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;BRAND&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kr&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;브랜드&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;얼굴 전체의 균형을 보고 디자인하는 퍼스널 PMU 스튜디오.&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
